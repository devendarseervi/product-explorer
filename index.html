
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Explore products with search, category filters, sorting, and a persistent cart.">
    <title>Product Explorer</title>
    <link rel="stylesheet" href="style.css">
    <script type="module" src="js/app.js"></script>
</head>
<body>
    <header class="site-header">
        <div class="container header-content">
            <a class="brand" href="./">Product Explorer</a>
            <button id="cart-toggle" type="button">
                Cart (<span id="cart-count">0</span>)
            </button>
        </div>
    </header>

    <main class="container">
        <section class="intro" aria-labelledby="page-title">
            <h1 id="page-title">Explore Products</h1>
            <p>Find products, compare prices, and manage your cart.</p>
        </section>

        <section class="controls" aria-label="Product controls">
            <label for="search-input">Search products</label>
            <input
                id="search-input"
                type="search"
                placeholder="Search by product name..."
            >

            <label for="category-filter">Category</label>
            <select id="category-filter">
                <option value="all">All categories</option>
            </select>

            <label for="sort-select">Sort by</label>
            <select id="sort-select">
                <option value="default">Default</option>
                <option value="price-asc">Price: low to high</option>
                <option value="price-desc">Price: high to low</option>
                <option value="name-asc">Name: A to Z</option>
            </select>
        </section>

        <p id="status-message" role="status" aria-live="polite">
            Products will load here.
        </p>

        <section
            id="product-grid"
            class="product-grid"
            aria-label="Products"
        ></section>

        <section id="cart-section" aria-labelledby="cart-title" hidden>
            <h2 id="cart-title">Your Cart</h2>
            <button id="cart-close" type="button">Close cart</button>
            <div id="cart-items"></div>
            <p>Total: <span id="cart-total">$0.00</span></p>
            <button id="clear-cart" type="button">Clear cart</button>
        </section>
    </main>

    <footer class="site-footer">
        <div class="container">
            <p>Product Explorer — Built with HTML, CSS, and JavaScript.</p>
        </div>
    </footer>
</body>
</html>
